name: Build & Package DartsMa (Android, iOS, PC & Web)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1 : Compilation Web & Distribution Hébergeur
  # -------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm --prefix client install
          npm --prefix server install

      - name: Build Web Production
        run: npm run build

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dartsma-web-distribution
          path: client/dist/

  # -------------------------------------------------------------
  # Job 2 : Compilation Android (APK & Bundle)
  # -------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend
        run: |
          npm install
          npm --prefix client install
          npm run build
          npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DartsMa-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # -------------------------------------------------------------
  # Job 3 : Compilation iOS (Xcode Archive & IPA)
  # -------------------------------------------------------------
  build-ios:
    runs-on: macos-14
    needs: build-web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend
        run: |
          npm install
          npm --prefix client install
          npm run build
          npx cap sync ios

      - name: Build iOS Xcode Project
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' clean build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS Xcode Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DartsMa-iOS-Build
          path: ios/App/build/

